services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: claimpilot
      POSTGRES_PASSWORD: claimpilot
      POSTGRES_DB: claimpilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimpilot -d claimpilot"]
      interval: 3s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6335:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  s3:
    # Local S3 stand-in (the official MinIO images are not pullable in this environment).
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: claimpilot-documents
    ports:
      - "9090:9090"

  api:
    build: ./backend
    image: claimpilot/backend:${IMAGE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://claimpilot:claimpilot@postgres:5432/claimpilot
      DATABASE_URL: postgresql+psycopg://claimpilot_app:claimpilot_app@postgres:5432/claimpilot
      APP_DB_PASSWORD: claimpilot_app
      S3_ENDPOINT_URL: http://s3:9090
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: claimpilot-documents
      JWT_SECRET: dev-only-change-me-please-use-32-chars-min
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 90 # CI runs this under CPU emulation, where start-up takes several minutes
      start_period: 20s

  console:
    build: ./frontend
    image: claimpilot/console:${IMAGE_TAG:-local}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build: ./backend
    image: claimpilot/backend:${IMAGE_TAG:-local}
    command: ["uv", "run", "--no-dev", "python", "-m", "app.pipeline.worker"]
    depends_on:
      api:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - path: .env # holds GOOGLE_API_KEY; never committed
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://claimpilot_app:claimpilot_app@postgres:5432/claimpilot
      S3_ENDPOINT_URL: http://s3:9090
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: claimpilot-documents
      QDRANT_URL: http://qdrant:6333
      LLM_MODE: ${LLM_MODE:-live}
      LLM_CACHE_DIR: /srv/llm_cache
    volumes:
      - fastembed:/home/appuser/fastembed
    healthcheck:
      disable: true # the image's check targets the API port

volumes:
  fastembed:
  pgdata:
  qdrantdata:
