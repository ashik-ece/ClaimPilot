name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claimpilot
          POSTGRES_PASSWORD: claimpilot
          POSTGRES_DB: claimpilot
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U claimpilot" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://claimpilot:claimpilot@localhost:5433/claimpilot
      DATABASE_URL: postgresql+psycopg://claimpilot_app:claimpilot_app@localhost:5433/claimpilot
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      # Tesseract is not installed here, so the OCR-dependent replay test skips. The
      # evaluation job runs that path inside the production image instead.
      - run: uv run pytest -q

  eval-harness:
    name: Evaluation harness tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: eval/uv.lock
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    name: Frontend types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  evaluation-gate:
    name: Evaluation gate (replayed model responses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: eval/uv.lock

      # Run inside the production image: OCR output differs between platforms, and the recorded
      # model responses are keyed on the exact prompt text, so the environment must match.
      - name: Start database, vector store and API
        run: docker compose up -d --build --wait postgres qdrant api

      - name: Create an admin and load the policies
        run: |
          docker compose exec -T api python -m app.cli create-user ci@example.com ci-password-123 admin
          cd eval && uv sync && uv run python -m dataset.load \
            --email ci@example.com --password ci-password-123 --policies-only

      - name: Replay extraction and analysis on the dev split
        run: |
          # The image's non-root user must be able to write the results.
          chmod -R a+rwX eval/results
          run_in_image() {
            docker compose run --rm --no-deps \
              -v "$PWD/eval:/eval" -v "$PWD/backend/llm_cache:/cache:ro" \
              -e LLM_MODE=replay -e LLM_CACHE_DIR=/cache -e GOOGLE_API_KEY= \
              worker uv run --no-dev python -W ignore -m app.pipeline.evalcli "$@"
          }
          run_in_image extract --split dev --out /eval/results/ci_preds_extract.json
          run_in_image analyze --extractions /eval/results/ci_preds_extract.json \
            --out /eval/results/ci_preds_pipeline.json

      - name: Score and apply the thresholds
        working-directory: eval
        run: |
          uv run python -m harness.run --predictions results/ci_preds_pipeline.json \
            --split dev --name ci_pipeline_dev
          uv run python -m harness.gate results/ci_pipeline_dev.json thresholds.json

      - name: Upload the scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: eval/results/ci_*.json

      - if: failure()
        run: docker compose logs --tail 80 api worker

  images:
    name: Production images build and pass smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait postgres qdrant s3 api console
      - run: |
          docker compose exec -T api python -m app.cli create-user smoke@example.com smoke-password-123 admin
          python3 scripts/smoke_test.py http://localhost:8080 \
            --email smoke@example.com --password smoke-password-123
      - if: failure()
        run: docker compose logs --tail 80
